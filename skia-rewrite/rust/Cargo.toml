[workspace]
resolver = "2"
members = [
    "crates/skia-rs-math",
    "crates/skia-rs-geometry",
    "crates/skia-rs-color",
    "crates/skia-rs-path",
    "crates/skia-rs-region",
    "crates/skia-rs-core-types",
    "crates/skia-rs-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
