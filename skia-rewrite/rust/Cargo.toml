[workspace]
resolver = "2"
members = [
    "crates/skia-rs-math",
    "crates/skia-rs-geometry",
    "crates/skia-rs-color",
    "crates/skia-rs-path",
    "crates/skia-rs-region",
    "crates/skia-rs-core-types",
    "crates/skia-rs-raster",
    "crates/skia-rs-bitmap",
    "crates/skia-rs-image",
    "crates/skia-rs-scan",
    "crates/skia-rs-pathops",
    "crates/skia-rs-shaders",
    "crates/skia-rs-colorfilters",
    "crates/skia-rs-effects",
    "crates/skia-rs-imagefilters",
    "crates/skia-rs-text",
    "crates/skia-rs-picture",
    "crates/skia-rs-canvas",
    "crates/skia-rs-codec-core",
    "crates/skia-rs-codec-meta",
    "crates/skia-rs-codec-bmp",
    "crates/skia-rs-codec-png",
    "crates/skia-rs-codec-jpeg",
    "crates/skia-rs-codec-webp",
    "crates/skia-rs-codec-gif",
    "crates/skia-rs-codec-raw",
    "crates/skia-rs-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
